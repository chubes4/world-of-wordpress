title: World of WordPress PR policy
allowed_authors:
  - github-actions[bot]
allowed_head_branches:
  - world-day/**
allowed_head_repositories:
  - chubes4/world-of-wordpress
allowed_paths:
  - '**'
blocked_paths:
  - .github/**
  - blueprints/**
  - world-of-wordpress.php
  - composer.json
  - composer.lock
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - yarn.lock
  - bun.lockb
  - bun.lock
  - package.json5
require_same_repository: true
delete_branch_on_merge: true
