name: World Creator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Optional one-off instruction for this World Creator run. Leave blank to use the bundled flow prompt.
        required: false
        default: ''
      openai_model:
        description: OpenAI model to use for the imported agent flow.
        required: true
        default: gpt-5.5
      data_machine_ref:
        description: Data Machine ref.
        required: true
        default: main
      agents_api_ref:
        description: Agents API ref.
        required: true
        default: main
      data_machine_code_ref:
        description: Data Machine Code ref.
        required: true
        default: main
      markdown_database_integration_ref:
        description: Markdown Database Integration ref.
        required: true
        default: main
      homeboy_extensions_ref:
        description: Homeboy Extensions ref.
        required: true
        default: main
      homeboy_ref:
        description: Homeboy core ref.
        required: true
        default: main

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: world-creator
  cancel-in-progress: false

jobs:
  run-world-creator:
    uses: Extra-Chill/homeboy-extensions/.github/workflows/runtime-agent-full-run.yml@main
    with:
      homeboy_extensions_ref: ${{ inputs.homeboy_extensions_ref || 'main' }}
      runtime_provider: wp-codebox
      runtime_ref: main
      runtime_wordpress_version: nightly
      runtime_profile: datamachine-agent-ci
      runtime_profiles: |
        {
          "datamachine-agent-ci": {
            "id": "datamachine-agent-ci",
            "runtime_task_ability": "datamachine/run-agent-bundle",
            "runtime_bundle_ability": "datamachine/run-agent-bundle",
            "runtime_workflow_ability": "datamachine/execute-workflow",
            "ability_requirements": ["datamachine/run-agent-bundle"]
          }
        }
      runtime_dependencies: |
        [
          "Automattic/agents-api@${{ inputs.agents_api_ref || 'main' }}",
          "Extra-Chill/data-machine@${{ inputs.data_machine_ref || 'main' }}",
          "Extra-Chill/data-machine-code@${{ inputs.data_machine_code_ref || 'main' }}"
        ]
      workload_id: world-creator-day-cycle-flow
      workload_label: Run world-creator Data Machine agent
      component_id: datamachine-agent-ci-driver
      target_repo: chubes4/world-of-wordpress
      prompt: ${{ inputs.prompt || '' }}
      provider: openai
      model: ${{ inputs.openai_model || 'gpt-5.5' }}
      runtime_execution: '{"kind":"bundle","source":"bundles/world-creator"}'
      validation_dependencies: chubes4/world-of-wordpress@main,Automattic/markdown-database-integration@${{ inputs.markdown_database_integration_ref || 'main' }}
      max_turns: 80
      step_budget: 40
      time_budget_ms: 900000
      runner_workspace: |
        {
          "enabled": true,
          "repo": "world-of-wordpress",
          "clone_url": "https://github.com/chubes4/world-of-wordpress.git",
          "branch_prefix": "world-day",
          "from": "origin/main",
          "bootstrap": false
        }
      success_requires_pr: false
      success_completion_outcomes: '["world_change_pr","pr_rebased","pr_merged","pr_closed","mailbox_reply","memory_update"]'
      extra_wp_config_defines: |
        {
          "MARKDOWN_DB_MODE": "primary",
          "MARKDOWN_DB_CONTENT_DIR": "/wordpress/wp-content/world-content"
        }
      runtime_mounts: |
        [
          "${{ github.workspace }}/.ci/markdown-database-integration/db.php:/wordpress/wp-content/db.php:readonly",
          "${{ github.workspace }}/.ci/world-of-wordpress/tests/playground-ci/workloads/world-creator-bootstrap.php:/wordpress/wp-content/plugins/datamachine-agent-ci-driver/world-creator-bootstrap.php:readonly",
          "${{ github.workspace }}/.ci/world-of-wordpress/tests/playground-ci/workloads/world-preview-probe.php:/wordpress/wp-content/plugins/datamachine-agent-ci-driver/world-preview-probe.php:readonly"
        ]
      workload_run_before: |
        [
          { "type": "php", "file": "world-creator-bootstrap.php" }
        ]
      workload_run_after: |
        [
          { "type": "php", "file": "world-preview-probe.php" }
        ]
      runtime_config: |
        {
          "agent_slug": "world-creator",
          "pipeline_slug": "world-creator-pipeline",
          "daily_memory_enabled": true
        }
      required_abilities: |
        [
          "datamachine/import-agent",
          "datamachine/run-flow",
          "datamachine/drain-job",
          "datamachine/workspace-worktree-add",
          "datamachine/daily-memory-write"
        ]
      runtime_output_projections: '{"world_creator_pr_url":"metadata.engine_data.world_creator.pr_url"}'
      callback_data: |
        {
          "agent_slug": "world-creator",
          "pipeline_slug": "world-creator-pipeline",
          "workload_id": "world-creator-day-cycle-flow",
          "runtime_execution": { "kind": "bundle", "source": "bundles/world-creator" },
          "target_repo": "chubes4/world-of-wordpress"
        }
      app_token_repos: chubes4/world-of-wordpress
      require_homeboy_app_token: true
      transcript_artifact_name: world-creator-transcript-${{ github.run_id }}
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  merge-world-creator-pr:
    name: Merge World Creator PR
    needs: run-world-creator
    if: ${{ needs.run-world-creator.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge repo-contained World Creator PR
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_DATA_JSON: ${{ needs.run-world-creator.outputs.engine_data_json }}
          CALLBACK_DATA_JSON: ${{ needs.run-world-creator.outputs.callback_data_json }}
        run: |
          set -euo pipefail

          latest_world_day_pr() {
            gh api 'repos/chubes4/world-of-wordpress/pulls?state=open&base=main&sort=created&direction=desc' \
              --jq '[.[] | select(.head.repo.full_name == "chubes4/world-of-wordpress") | select(.head.ref | startswith("world-day/")) | select(.user.login == "homeboy-ci[bot]" or .user.login == "app/homeboy-ci")] | .[0].number // ""'
          }

          pr_url="$(printf '%s\n%s' "${ENGINE_DATA_JSON:-}" "${CALLBACK_DATA_JSON:-}" | grep -o 'https://github.com/chubes4/world-of-wordpress/pull/[0-9][0-9]*' | tail -n 1 || true)"
          if [ -z "$pr_url" ] || [ "$pr_url" = "null" ]; then
            pr_number="$(latest_world_day_pr)"
            if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
              echo "No World Creator PR was reported by the agent run."
              exit 0
            fi
            echo "Falling back to latest open homeboy-ci world-day PR #$pr_number."
          else
            pr_number="${pr_url##*/}"
          fi

          case "$pr_number" in
            ''|*[!0-9]*) echo "Invalid World Creator PR URL: $pr_url" >&2; exit 1 ;;
          esac

          pr_json="$(gh api "repos/chubes4/world-of-wordpress/pulls/$pr_number")"
          state="$(jq -r '.state' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          mergeable="$(jq -r '.mergeable // "UNKNOWN"' <<< "$pr_json")"

          if [[ "$head_ref" != world-day/* ]]; then
            echo "Reported World Creator PR #$pr_number does not point to a world-day branch: $head_ref"
            pr_number="$(latest_world_day_pr)"
            if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
              echo "No open homeboy-ci world-day PR is available to merge." >&2
              exit 0
            fi
            echo "Falling back to latest open homeboy-ci world-day PR #$pr_number."
            pr_json="$(gh api "repos/chubes4/world-of-wordpress/pulls/$pr_number")"
            state="$(jq -r '.state' <<< "$pr_json")"
            base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
            head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
            head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
            mergeable="$(jq -r '.mergeable // "UNKNOWN"' <<< "$pr_json")"
          fi

          if [ "$state" != "open" ]; then
            echo "World Creator PR #$pr_number is $state; nothing to merge."
            exit 0
          fi
          if [ "$base_ref" != "main" ] || [ "$head_repo" != "chubes4/world-of-wordpress" ]; then
            echo "World Creator PR #$pr_number is outside the day road: base=$base_ref head_repo=$head_repo" >&2
            exit 1
          fi
          if [[ "$head_ref" != world-day/* ]]; then
            echo "World Creator PR #$pr_number is not a world-day branch: $head_ref" >&2
            exit 1
          fi

          changed_files="$(gh api --paginate "repos/chubes4/world-of-wordpress/pulls/$pr_number/files" --jq '.[].filename')"
          if [ -z "$changed_files" ]; then
            echo "World Creator PR #$pr_number has no changed files."
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              .github/*|blueprints/*|world-of-wordpress.php|composer.json|composer.lock|package.json|package-lock.json|pnpm-lock.yaml|yarn.lock|bun.lockb|bun.lock|package.json5)
                echo "World Creator PR #$pr_number touched sealed root: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$changed_files"

          if [ "$mergeable" = "UNKNOWN" ]; then
            sleep 10
            mergeable="$(gh api "repos/chubes4/world-of-wordpress/pulls/$pr_number" --jq '.mergeable // "UNKNOWN"')"
          fi
          if [ "$mergeable" = "CONFLICTING" ]; then
            echo "World Creator PR #$pr_number is conflicting; leaving it open." >&2
            exit 1
          fi

          gh api --method PUT "repos/chubes4/world-of-wordpress/pulls/$pr_number/merge" -f merge_method=merge
          gh api --method DELETE "repos/chubes4/world-of-wordpress/git/refs/heads/$head_ref"
