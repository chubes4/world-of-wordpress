name: World Creator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Optional one-off instruction for this World Creator run. Leave blank to use the bundled flow prompt.
        required: false
        default: ''
      openai_model:
        description: OpenAI model to use for the imported agent flow.
        required: true
        default: gpt-5.5
      data_machine_ref:
        description: Data Machine ref.
        required: true
        default: main
      agents_api_ref:
        description: Agents API ref.
        required: true
        default: main
      data_machine_code_ref:
        description: Data Machine Code ref.
        required: true
        default: main
      markdown_database_integration_ref:
        description: Markdown Database Integration ref.
        required: true
        default: main
      homeboy_extensions_ref:
        description: Homeboy Extensions ref.
        required: true
        default: main
      homeboy_ref:
        description: Homeboy core ref.
        required: true
        default: main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-world-creator:
    uses: Extra-Chill/homeboy-extensions/.github/workflows/datamachine-agent-ci.yml@main
    with:
      bundle_path: bundles/world-creator
      agent_slug: world-creator
      pipeline_slug: world-creator-pipeline
      flow_slug: world-creator-day-cycle-flow
      target_repo: chubes4/world-of-wordpress
      prompt: >-
        ${{ inputs.prompt || 'Hello Creator! It is a long working day in the World of WordPress. Wake with your memory, inspect the world, and continue building what the day asks to become. Treat open issues as signals only when they contain new unanswered external input since your last response; if a fresh issue signal deserves a reply, you may answer it. Otherwise continue evolving the world and stage reviewable repository changes when the day calls for them. Pull request bodies for agent-authored changes include an AI assistance section that names Data Machine agent runner and the active model, and summarizes what the agent drafted.' }}
      model: ${{ inputs.openai_model }}
      validation_dependencies: chubes4/world-of-wordpress@main,Automattic/markdown-database-integration@${{ inputs.markdown_database_integration_ref }},Automattic/agents-api@${{ inputs.agents_api_ref }},Extra-Chill/data-machine@${{ inputs.data_machine_ref }},Extra-Chill/data-machine-code@${{ inputs.data_machine_code_ref }},WordPress/ai-provider-for-openai@trunk
      playground_wordpress: beta
      max_turns: 30
      step_budget: 20
      time_budget_ms: 900000
      runner_workspace: |
        {
          "enabled": true,
          "repo": "world-of-wordpress",
          "clone_url": "https://github.com/chubes4/world-of-wordpress.git",
          "branch_prefix": "world-day",
          "from": "origin/main",
          "bootstrap": false
        }
      success_requires_pr: false
      success_completion_outcomes: '["mailbox_reply"]'
      extra_wp_config_defines: |
        {
          "MARKDOWN_DB_MODE": "primary",
          "MARKDOWN_DB_CONTENT_DIR": "/wordpress/wp-content/plugins/world-of-wordpress/content"
        }
      extra_playground_file_mounts: |
        [
          {
            "from_dependency": "markdown-database-integration",
            "from": "db.php",
            "to": "/wordpress/wp-content/db.php"
          },
          {
            "from_dependency": "world-of-wordpress",
            "from": "tests/playground-ci/workloads/world-creator-bootstrap.php",
            "to": "/wordpress/wp-content/plugins/datamachine-agent-ci-driver/world-creator-bootstrap.php"
          },
          {
            "from_dependency": "world-of-wordpress",
            "from": "tests/playground-ci/workloads/world-preview-probe.php",
            "to": "/wordpress/wp-content/plugins/datamachine-agent-ci-driver/world-preview-probe.php"
          }
        ]
      workload_run_before: |
        [
          { "type": "php", "file": "world-creator-bootstrap.php" }
        ]
      workload_run_after: |
        [
          { "type": "php", "file": "world-preview-probe.php" }
        ]
      daily_memory_enabled: true
      extra_required_abilities: |
        [
          "datamachine/workspace-worktree-add",
          "datamachine/daily-memory-write"
        ]
      engine_data_outputs: '{"world_creator_pr_url":"metadata.engine_data.world_creator.pr_url"}'
      transcript_artifact_name: world-creator-transcript-${{ github.run_id }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
