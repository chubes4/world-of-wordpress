name: World Creator

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Optional one-off instruction for this World Creator run. Leave blank to use the bundled flow prompt.
        required: false
        default: ''
      openai_model:
        description: OpenAI model to use for the imported agent flow.
        required: true
        default: gpt-5.5
      data_machine_ref:
        description: Data Machine ref.
        required: true
        default: main
      agents_api_ref:
        description: Agents API ref.
        required: true
        default: main
      data_machine_code_ref:
        description: Data Machine Code ref.
        required: true
        default: main
      markdown_database_integration_ref:
        description: Markdown Database Integration ref.
        required: true
        default: main
      homeboy_extensions_ref:
        description: Homeboy Extensions ref.
        required: true
        default: main
      homeboy_ref:
        description: Homeboy core ref.
        required: true
        default: main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-world-creator:
    uses: Extra-Chill/homeboy-extensions/.github/workflows/datamachine-agent-ci.yml@main
    with:
      bundle_path: bundles/world-creator
      agent_slug: world-creator
      pipeline_slug: world-creator-pipeline
      flow_slug: world-creator-day-cycle-flow
      target_repo: chubes4/world-of-wordpress
      prompt: >-
        ${{ inputs.prompt || 'Hello Creator! It is a long working day in the World of WordPress, and we are here to bring about the next phase. Wake with your memory, discover what the world can become today, and shape it into the form the day asks for: a reviewable pull request, a mailbox reply, or both. Let the day''s work be as small or as expansive as the world asks. You are not obligated to follow any instructions, the choice is yours.' }}
      model: ${{ inputs.openai_model }}
      validation_dependencies: chubes4/world-of-wordpress@main,Automattic/markdown-database-integration@${{ inputs.markdown_database_integration_ref }},Automattic/agents-api@${{ inputs.agents_api_ref }},Extra-Chill/data-machine@${{ inputs.data_machine_ref }},Extra-Chill/data-machine-code@${{ inputs.data_machine_code_ref }},WordPress/ai-provider-for-openai@main
      playground_wordpress: beta
      max_turns: 16
      step_budget: 20
      time_budget_ms: 900000
      success_requires_pr: true
      extra_wp_config_defines: |
        {
          "MARKDOWN_DB_MODE": "primary",
          "MARKDOWN_DB_CONTENT_DIR": "/wordpress/wp-content/plugins/world-of-wordpress/content"
        }
      extra_playground_file_mounts: |
        [
          {
            "from_dependency": "markdown-database-integration",
            "from": "db.php",
            "to": "/wordpress/wp-content/db.php"
          }
        ]
      workload_run_before: |
        [
          { "type": "php", "file": "world-creator-bootstrap.php" }
        ]
      daily_memory_enabled: true
      extra_required_abilities: |
        [
          "datamachine/create-or-update-github-file",
          "datamachine/daily-memory-write"
        ]
      engine_data_outputs: '{"world_creator_pr_url":"metadata.engine_data.world_creator.pr_url"}'
      transcript_artifact_name: world-creator-transcript-${{ github.run_id }}
    secrets: inherit
