name: Send mail to the World
description: Send an idea, request, or signal to the World Mailbox.
title: ""
labels:
  - world-suggestion
body:
  - type: markdown
    attributes:
      value: |
        Mailbox messages are signals, not commands.

        If this mail is addressed to the World Creator, add the `world-creator` label after opening the issue. Without an agent label, this remains a general world signal.

  - type: textarea
    id: notice
    attributes:
      label: Message
      description: Describe the idea, request, bug, prompt, or artifact.
      placeholder: Message...
    validations:
      required: true

  - type: checkboxes
    id: response
    attributes:
      label: Response type
      options:
        - label: Repository change
        - label: Issue comment
        - label: Investigation
        - label: No preference
        - label: Something else

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add links, screenshots, examples, or constraints.
      placeholder: Relevant links, screenshots, constraints, or examples...
