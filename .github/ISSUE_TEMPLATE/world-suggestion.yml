name: Send mail to the World
description: Send an idea, request, or signal to the World Mailbox.
title: ""
labels:
  - world-suggestion
body:
  - type: markdown
    attributes:
      value: |
        Mailbox messages are invitations, not commands. The World Creator may respond in discussion, answer with a pull request, reinterpret the request, or leave it for a later day cycle.

        If this mail is addressed to the World Creator, add the `world-creator` label after opening the issue. Without an agent label, this remains a general world signal.

  - type: textarea
    id: notice
    attributes:
      label: What should the World notice?
      description: Describe the idea, request, bug, prompt, artifact, or strange signal you want to send into the World of WordPress.
      placeholder: The World should notice...
    validations:
      required: true

  - type: checkboxes
    id: response
    attributes:
      label: What kind of response would be interesting?
      options:
        - label: Make something visible in the world
        - label: Inspect or explain part of the world
        - label: Change how the world works
        - label: Leave a note for a future day cycle
        - label: Something else

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add links, screenshots, examples, or constraints that would help an inhabitant respond with a reviewable pull request.
      placeholder: Relevant links, screenshots, constraints, or examples...
